name: Scorecard

# Scores the repository's security practices with the OpenSSF Scorecard
# (https://scorecard.dev), uploads the findings to code scanning and publishes
# the result for the badge. Runs weekly, on pushes to main and when branch
# protection changes.
#
# Scorecard refuses to publish results from a job that has top-level env,
# defaults, containers, services or run steps, so this job only has uses steps.
on:
  push:
    branches: [main]
  schedule:
    - cron: '23 4 * * 1'
  branch_protection_rule:
  workflow_dispatch:

# A newer run for the same ref supersedes runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  scorecard:
    name: Scorecard analysis
    runs-on: ubuntu-26.04
    permissions:
      contents: read          # check out the repo
      actions: read           # read workflow files and runs for the checks
      security-events: write  # upload the results to code scanning
      id-token: write         # publish the results to the OpenSSF API
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      - uses: ossf/scorecard-action@fa7117db83c52d787ae5a89f350999701505d78e # v2.5.0
        with:
          results_file: results.sarif
          results_format: sarif
          publish_results: true
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: scorecard-results
          path: results.sarif
          retention-days: 5
      - uses: github/codeql-action/upload-sarif@9b3254085494b55a0f7c4c2b3d2d52cc712ce370 # v4.39.1
        with:
          sarif_file: results.sarif
