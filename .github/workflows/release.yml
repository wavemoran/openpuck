name: Release

# release-please keeps a "Release PR" open on main (version bump in version.txt
# plus CHANGELOG.md). Merging it creates the vX.Y.Z tag and the GitHub Release.
# The firmware build lives in THIS workflow rather than a separate one that
# triggers on `release: published`, because releases created with GITHUB_TOKEN
# do not trigger other workflows.
#
# release-please uses a GitHub App token when the RELEASE_APP_CLIENT_ID
# variable and RELEASE_APP_PRIVATE_KEY secret are set in the "release"
# environment, because PRs opened with the built-in token don't get CI runs.
# Without them it falls back to the built-in token.
#
# Run it manually with a tag (Actions > Release > Run workflow) to rebuild and
# re-upload the files for an existing release, for example after a failed build.

on:
  push:
    branches: [main]
  workflow_dispatch:
    inputs:
      tag:
        description: Existing release tag to rebuild (for example v0.1.0). Leave empty to run release-please.
        required: false
        default: ""

concurrency:
  group: release
  cancel-in-progress: false

permissions: {}

jobs:
  release-please:
    name: Release PR / tag
    if: ${{ !inputs.tag }}
    runs-on: ubuntu-26.04
    # The App's client ID and key live in the "release" environment, which only
    # the main branch can use.
    environment: release
    permissions:
      contents: write       # create the release tag and update version.txt/CHANGELOG.md
      pull-requests: write  # open and update the Release PR
    outputs:
      release_created: ${{ steps.rp.outputs.release_created }}
      tag_name: ${{ steps.rp.outputs.tag_name }}
      version: ${{ steps.rp.outputs.version }}
    steps:
      - id: app
        if: ${{ vars.RELEASE_APP_CLIENT_ID != '' }}
        uses: actions/create-github-app-token@64ab729a6294000f5aa4a4bc0b73d1f32bc45510 # v3.3.0
        with:
          client-id: ${{ vars.RELEASE_APP_CLIENT_ID }}
          private-key: ${{ secrets.RELEASE_APP_PRIVATE_KEY }}
          permission-contents: write
          permission-pull-requests: write
      - id: rp
        uses: googleapis/release-please-action@45996ed1f6d02564a971a2fa1b5860e934307cf7 # v5.0.0
        with:
          token: ${{ steps.app.outputs.token || github.token }}
          config-file: release-please-config.json
          manifest-file: .release-please-manifest.json

  # Builds inside the same pinned ESP-IDF container as ci.yml. The container has
  # no gh CLI, so this job only builds and packages; the next job (on a plain
  # runner) attests and uploads.
  build:
    name: Build release firmware
    needs: release-please
    # Runs after a new release, or for a manual rebuild (release-please skipped).
    if: ${{ !cancelled() && (needs.release-please.outputs.release_created == 'true' || inputs.tag) }}
    runs-on: ubuntu-26.04
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    permissions:
      contents: read
    env:
      TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
          persist-credentials: false
      # The version comes from the tag; it must match version.txt at that tag.
      - name: Check tag and version
        shell: bash
        run: |
          set -euo pipefail
          [[ "$TAG" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]] || { echo "Not a release tag: $TAG"; exit 1; }
          VERSION="${TAG#v}"
          [ "$(cat version.txt)" = "$VERSION" ] || { echo "version.txt does not match $TAG"; exit 1; }
          echo "VERSION=$VERSION" >> "$GITHUB_ENV"
      # Reuse the compiler and component caches saved by CI on main (restore
      # only: release runs don't add cache entries).
      - name: Restore compiler cache
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-idf6.1-${{ hashFiles('sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: |
            ccache-idf6.1-${{ hashFiles('sdkconfig.defaults') }}-
            ccache-idf6.1-
      - name: Restore downloaded components
        uses: actions/cache/restore@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: managed_components
          key: components-${{ hashFiles('dependencies.lock') }}
      - name: Build (release profile)
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # In a container job the github.workspace expression is the host path; use the env var.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_MAXSIZE=500M
          # The -specs file IDF passes is regenerated every build; compare by
          # content, not mtime, or every lookup misses.
          export CCACHE_COMPILERCHECK=content
          ccache -z
          idf.py build
          ccache -s
      - name: Package
        shell: bash
        run: |
          set -euo pipefail
          . "$IDF_PATH/export.sh"
          mkdir -p dist
          cd build
          # Single image for a full flash from 0x0 (bootloader 0x0, partition
          # table 0x8000, app 0x10000, taken from flash_args).
          python -m esptool --chip esp32c3 merge-bin \
            -o "../dist/openpuck-${VERSION}-esp32c3.bin" @flash_args
          # Separate parts plus flash_args, flattened (paths in flash_args
          # rewritten to bare file names) so `esptool write-flash @flash_args`
          # works from the unzipped folder.
          mkdir -p ../parts
          cp bootloader/bootloader.bin partition_table/partition-table.bin \
            openpuck.bin ../parts/
          sed -E 's#[^ ]*/##' flash_args > ../parts/flash_args
          cat ../parts/flash_args
          (cd ../parts && python -m zipfile -c \
            "../dist/openpuck-${VERSION}-parts.zip" \
            bootloader.bin partition-table.bin openpuck.bin flash_args)
          cd ../dist
          # ESP Web Tools manifest for the merged image (for third-party
          # flashing tools; the OpenPuck installer writes the parts instead).
          python - "$VERSION" <<'PY'
          import json, sys
          v = sys.argv[1]
          manifest = {
              "name": "OpenPuck",
              "version": v,
              "new_install_prompt_erase": False,
              "builds": [{
                  "chipFamily": "ESP32-C3",
                  "parts": [{"path": f"openpuck-{v}-esp32c3.bin", "offset": 0}],
              }],
          }
          with open("manifest.json", "w") as f:
              json.dump(manifest, f, indent=2)
              f.write("\n")
          PY
          sha256sum "openpuck-${VERSION}-esp32c3.bin" "openpuck-${VERSION}-parts.zip" manifest.json > SHA256SUMS
          ls -l
      - uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: release-files
          path: dist/*
          if-no-files-found: error

  publish:
    name: Attest and upload
    needs: [release-please, build]
    if: ${{ !cancelled() && needs.build.result == 'success' }}
    runs-on: ubuntu-26.04
    permissions:
      contents: write       # upload files to the GitHub Release
      id-token: write       # OIDC token for signing build provenance
      attestations: write   # store the provenance attestations
    steps:
      - uses: actions/download-artifact@9000827ccba6bdab643e8b6fd33ac0654aef8333 # v8.0.2
        with:
          name: release-files
          path: dist
      # GitHub stores attestations only for public repos (or paid org plans),
      # so skip it while the repo is private instead of failing the release.
      - uses: actions/attest-build-provenance@4d101475d8b20a2381f78447822ac1eab6504dd8 # v4.2.2
        if: ${{ !github.event.repository.private }}
        with:
          subject-path: dist/*
      - name: Upload to the release
        env:
          GH_TOKEN: ${{ github.token }}
          TAG: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
        run: gh release upload "$TAG" dist/* --clobber --repo "$GITHUB_REPOSITORY"

  # Redeploys the browser installer with this release's firmware. Called as a
  # reusable workflow, so these permissions must cover everything pages.yml
  # asks for.
  pages:
    name: Deploy installer
    needs: [release-please, publish]
    if: ${{ !cancelled() && needs.publish.result == 'success' }}
    permissions:
      contents: read       # pages.yml checks out the repo and reads release assets
      attestations: read   # pages.yml verifies the firmware's build provenance
      pages: write         # pages.yml publishes the site
      id-token: write      # pages.yml's deploy job proves its identity to Pages
    # $/ is GitHub's self-repository syntax: this repo at the running commit.
    uses: $/.github/workflows/pages.yml
    with:
      tag: ${{ inputs.tag || needs.release-please.outputs.tag_name }}
