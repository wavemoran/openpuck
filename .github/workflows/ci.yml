name: CI

on:
  push:
    branches: [main]
    # Merging a Release PR only bumps these files, and the release job builds
    # the firmware anyway, so skip CI when they are the only changes. (The
    # workflow still runs if any other file changed. Push only: path filters on
    # pull_request would leave required checks pending.)
    paths-ignore:
      - CHANGELOG.md
      - version.txt
      - .release-please-manifest.json
  pull_request:

# A newer push to the same branch or PR supersedes runs still in progress.
concurrency:
  group: ${{ github.workflow }}-${{ github.event.pull_request.number || github.ref }}
  cancel-in-progress: true

permissions: {}

jobs:
  changes:
    name: Detect code changes
    runs-on: ubuntu-26.04
    permissions:
      pull-requests: read  # list the PR's changed files
    outputs:
      code: ${{ steps.filter.outputs.code }}
    steps:
      # Docs-only PRs skip the builds. Skipped jobs still count as passing for
      # required checks, so nothing waits on them. Pushes to main always build.
      - id: filter
        env:
          GH_TOKEN: ${{ github.token }}
          PR: ${{ github.event.pull_request.number }}
          REPO: ${{ github.repository }}
        run: |
          if [ -z "$PR" ]; then
            echo "code=true" >> "$GITHUB_OUTPUT"
            exit 0
          fi
          code=false
          while IFS= read -r f; do
            case "$f" in
              *.md|docs/*|LICENSE|NOTICE|.github/ISSUE_TEMPLATE/*) ;;
              *) code=true ;;
            esac
          done < <(gh api "repos/$REPO/pulls/$PR/files" --paginate --jq '.[].filename')
          echo "code=$code" >> "$GITHUB_OUTPUT"

  host-tests:
    name: Unit tests + coverage
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # Pinned for reproducible coverage results; bump by hand (Dependabot
      # doesn't track pipx installs).
      - name: Install gcovr
        run: pipx install gcovr==8.8
      - name: Run tests (fails below 90 % line coverage)
        run: tools/test.sh
      - name: Upload coverage report
        if: always()
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: coverage-report
          path: build-host/coverage/
      # The browser installer's JS tests (node:test, no npm packages).
      - uses: actions/setup-node@949feb2413d6458794dcd2491c4babbbce0c15c1 # v7.1.0
        with:
          node-version: 24
          package-manager-cache: false
      - name: Run installer tests (fails below 90 % line coverage)
        run: tools/test-installer.sh

  firmware:
    name: Firmware build (ESP-IDF v6.1)
    needs: changes
    if: needs.changes.outputs.code == 'true'
    runs-on: ubuntu-26.04
    permissions:
      contents: read
    container: espressif/idf:v6.1@sha256:81893c71bb5e570088901f21def8684c25cd2a9020281bd01b843a7655edb18c
    steps:
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          persist-credentials: false
      # The container has ccache enabled (IDF_CCACHE_ENABLE=1); keeping its
      # directory between runs turns a ~4 minute full build into a short one.
      # Caches saved on main are readable by PRs.
      - name: Restore compiler cache
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: .ccache
          key: ccache-idf6.1-${{ hashFiles('sdkconfig.defaults') }}-${{ github.sha }}
          restore-keys: |
            ccache-idf6.1-${{ hashFiles('sdkconfig.defaults') }}-
            ccache-idf6.1-
      - name: Restore downloaded components
        uses: actions/cache@55cc8345863c7cc4c66a329aec7e433d2d1c52a9 # v6.1.0
        with:
          path: managed_components
          key: components-${{ hashFiles('dependencies.lock') }}
      - name: Build
        shell: bash
        run: |
          git config --global --add safe.directory "$GITHUB_WORKSPACE"
          . "$IDF_PATH/export.sh"
          # In a container job the github.workspace expression is the host path; use the env var.
          export CCACHE_DIR="$GITHUB_WORKSPACE/.ccache" CCACHE_MAXSIZE=500M
          # The -specs file IDF passes is regenerated every build; compare by
          # content, not mtime, or every lookup misses.
          export CCACHE_COMPILERCHECK=content
          ccache -z
          idf.py build
          ccache -s
      - name: Upload firmware
        uses: actions/upload-artifact@cf430e030ddbb5b0abf93d22962f4752f3646cd9 # v7.0.2
        with:
          name: openpuck-firmware
          path: |
            build/bootloader/bootloader.bin
            build/partition_table/partition-table.bin
            build/openpuck.bin
            build/flash_args
